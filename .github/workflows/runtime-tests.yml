name: Runtime regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: bootstrap
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-test.lock.txt
      - name: Install in a clean isolated environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install -r requirements-test.lock.txt
          .ci-venv/bin/python -m pip check
      - name: Run complete regression suite
        env:
          INCIDENT_AGENT_CLEAN_ENV: '1'
          INCIDENT_AGENT_TEST_DATABASE_URL: mysql+pymysql://root:ci-local-only@127.0.0.1:${{ job.services.mysql.ports[3306] }}/bootstrap?charset=utf8mb4
        run: .ci-venv/bin/python -B -m pytest tests -q --disable-warnings

  windows-remediation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-test.lock.txt
      - name: Install in a clean isolated environment
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.ci-venv\Scripts\python -m pip install -r requirements-test.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.ci-venv\Scripts\python -m pip check
      - name: Test Windows remediation boundaries
        env:
          INCIDENT_AGENT_CLEAN_ENV: '1'
        run: .\.ci-venv\Scripts\python -B -m pytest tests/test_w2_demo.py tests/test_w3_authorization.py tests/test_w3_source_pin.py -q --disable-warnings

  frontend:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Test read-only pages and API handling
        run: npm test
      - name: Type check and production build
        run: npm run build
