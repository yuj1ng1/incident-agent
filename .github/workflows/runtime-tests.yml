name: Runtime regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-test.lock.txt
      - name: Install in a clean isolated environment
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.ci-venv\Scripts\python -m pip install -r requirements-test.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.ci-venv\Scripts\python -m pip check
      - name: Run complete regression suite
        env:
          INCIDENT_AGENT_CLEAN_ENV: '1'
        run: .\.ci-venv\Scripts\python -B -m pytest tests -q --disable-warnings
