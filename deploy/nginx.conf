server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://api:8010;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host localhost;
    }

    location = /readyz {
        proxy_pass $backend/readyz;
        proxy_set_header Host localhost;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
